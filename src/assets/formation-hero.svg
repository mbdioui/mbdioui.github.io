<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Formation Android — Kotlin &amp; Jetpack Compose">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="codeBar1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 80 H640 M0 160 H640 M0 240 H640 M0 320 H640 M0 400 H640"/>
    <path d="M80 0 V480 M160 0 V480 M240 0 V480 M320 0 V480 M400 0 V480 M480 0 V480 M560 0 V480"/>
  </g>

  <!-- Decorative blobs -->
  <circle cx="120" cy="100" r="120" fill="rgba(16,185,129,0.18)"/>
  <circle cx="540" cy="380" r="160" fill="rgba(139,92,246,0.18)"/>

  <!-- Phone mockup -->
  <g transform="translate(220,60)">
    <rect x="0" y="0" width="200" height="360" rx="28" fill="url(#phone)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <rect x="10" y="10" width="180" height="340" rx="20" fill="#0b1220"/>

    <!-- Status bar -->
    <rect x="20" y="22" width="40" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
    <circle cx="170" cy="25" r="3" fill="rgba(16,185,129,0.9)"/>

    <!-- App header -->
    <text x="28" y="62" font-family="-apple-system,system-ui,Segoe UI" font-weight="700" font-size="14" fill="#fff">Leçon 1.1</text>
    <rect x="28" y="72" width="80" height="6" rx="3" fill="rgba(255,255,255,0.18)"/>

    <!-- Code lines -->
    <g transform="translate(28,110)">
      <rect x="0" y="0" width="140" height="6" rx="3" fill="url(#codeBar1)"/>
      <rect x="10" y="14" width="120" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
      <rect x="10" y="28" width="100" height="6" rx="3" fill="rgba(16,185,129,0.55)"/>
      <rect x="20" y="42" width="110" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
      <rect x="20" y="56" width="80"  height="6" rx="3" fill="rgba(14,165,233,0.55)"/>
      <rect x="0"  y="70" width="130" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
      <rect x="10" y="84" width="60"  height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
      <rect x="10" y="98" width="90"  height="6" rx="3" fill="rgba(139,92,246,0.55)"/>
      <rect x="0"  y="112" width="140" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
    </g>

    <!-- Quiz card -->
    <g transform="translate(28,260)">
      <rect x="0" y="0" width="144" height="64" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.4)"/>
      <circle cx="14" cy="14" r="6" fill="rgba(16,185,129,0.9)"/>
      <rect x="26" y="10" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.55)"/>
      <rect x="26" y="22" width="100" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>
      <rect x="26" y="34" width="70"  height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>
      <rect x="10" y="50" width="124" height="6" rx="3" fill="url(#accent)"/>
    </g>

    <!-- Notch -->
    <rect x="80" y="6" width="40" height="6" rx="3" fill="#000"/>
  </g>

  <!-- Floating badges -->
  <g transform="translate(60,260)">
    <rect x="0" y="0" width="140" height="44" rx="22" fill="rgba(255,255,255,0.95)" stroke="rgba(15,23,42,0.06)"/>
    <circle cx="22" cy="22" r="11" fill="url(#accent)"/>
    <text x="22" y="26" font-family="-apple-system,system-ui,Segoe UI" font-weight="800" font-size="10" fill="#fff" text-anchor="middle">K</text>
    <text x="42" y="20" font-family="-apple-system,system-ui,Segoe UI" font-weight="800" font-size="11" fill="#0f172a">Kotlin</text>
    <text x="42" y="33" font-family="-apple-system,system-ui,Segoe UI" font-weight="500" font-size="9"  fill="#475569">Lesson 1.1</text>
  </g>

  <g transform="translate(440,80)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="rgba(255,255,255,0.95)" stroke="rgba(15,23,42,0.06)"/>
    <circle cx="22" cy="22" r="11" fill="url(#accent)"/>
    <text x="22" y="26" font-family="-apple-system,system-ui,Segoe UI" font-weight="800" font-size="10" fill="#fff" text-anchor="middle">C</text>
    <text x="42" y="20" font-family="-apple-system,system-ui,Segoe UI" font-weight="800" font-size="11" fill="#0f172a">Jetpack</text>
    <text x="42" y="33" font-family="-apple-system,system-ui,Segoe UI" font-weight="500" font-size="9"  fill="#475569">Compose</text>
  </g>
</svg>
